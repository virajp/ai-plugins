# Project Registry — docs/blueprint/registry.yaml
#
# The machine-readable description of the system. `blueprint`, `plan`,
# `execute`, `verify`, `screens`, and `mockups` parse THIS file; none of them
# reads architecture.md, which is the prose view of the same facts.
#
# Typed by path (no frontmatter), like schema.yaml and the OpenAPI contracts.
#
# What is NOT here:
#   - `stack` — the concrete technology per project lives in `.config/vwf.yaml`
#     under `projects.<name>.stack`, selected from the template menu for the
#     project's roles (assets/stacks/). Keeping it out is what makes the
#     blueprint structurally incapable of naming a vendor: no authoring or
#     reviewing surface reads it.
#   - enforcement opt-outs — vwf operating config, `.config/vwf.yaml`.
#   - prose, rationale, or hosting narrative — architecture.md.

vwf_registry: 1 # registry schema version

projects:
  - name: <project-name>
    # ROLES IS A LIST, AND ORDER IS PRECEDENCE. The first role owns the
    # project's layout, testing and deploy conventions; later roles add gates
    # and contribute only non-conflicting sections. [site, service] and
    # [service, site] are therefore DIFFERENT projects — order is a decision,
    # never incidental. An operator back-office is [site, service] plus the
    # `operator-rbac` capability (there is no `console` role since format 19).
    roles: [ <service|worker|packages|site|frontend|infra>, <...> ]
    path: <repo-or-directory>
    capabilities: [ <capability>, <...> ] # assets/capability-vocabulary.md
    depends_on: [ <project-name>, <...> ] # or []
    doc_unit: <entity|page|module> # defaults from the FIRST role
    platforms: [ <mobile|tablet|desktop|web|auto>, <...> ] # UI roles only

# System-wide concerns → the anchors blueprint expands in conventions.md.
# One token per concern; include only the concerns the system actually has.
cross_cutting:
  auth: <selection> # e.g. provider-id-token, jwt, session-cookie, none
  errors: <selection> # e.g. coded-envelope, http-status-only
  observability: <selection> # e.g. opentelemetry, structured-json-logs, none
  config: <selection> # e.g. env-vars, secrets-manager
  testing: <selection> # e.g. unit-integration, none
  integrations: [ <service-name>, <...> ] # external services, or []
# foundation tokens (product-foundations) — present only when accepted:
# audit: privileged-destructive
# notifications: [ push, email ]
# background: durable-worker-ephemeral-service
# data-retention: gdpr-dpdpa
# runtime_settings: cached-settings-doc
# rate_limiting: endpoint-classes
# changelog: keepachangelog-fastlane
