name: Cloud SQL for PostgreSQL
summary: Managed relational Postgres — the answer when the data model has real
  relationships, when reporting queries matter, or when the product must stay
  portable off this provider.
version: 0.1.0
type: cloud-service
category: sql
capability: relational-datastore
kind: cloud-provider
axis: backing
harness:
  local_stack:
    task: stack:up
    mechanism: >-
      Docker-composed Postgres on production's major version, behind a wait-on
      readiness gate — there is no emulator for this service
