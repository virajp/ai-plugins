name: Temporal
summary: Durable execution that needs no cloud — a workflow is ordinary code
  whose progress is persisted, so a crash, a deploy or a week-long wait resumes
  where it stopped.
version: 0.1.0
type: capability-provider
category: workflow
capability: durable-workflows
kind: capability-provider
axis: backing
harness:
  local_stack:
    task: stack:up
    mechanism: >-
      Docker-composed dev server behind a wait-on readiness gate, plus the engine's own time-skipping test framework
