name: Flutter
summary: The cross-platform app SDK that owns the manifest, the build and the
  project layout — one codebase across mobile, tablet, desktop and web.
version: 0.1.0
type: app-framework
category: cross-platform-ui
kind: app-framework
axis: project
platforms: [ mobile, tablet, desktop, webapp ]
languages:
  - token: dart
    role: primary
    facts:
      lsp: >-
        dart language-server, provisioned through the Flutter SDK rather than
        beside it; declared by this pack as `dart-lsp`
      mise_tool: flutter
      manifest: pubspec.yaml
  - token: kotlin
    role: platform-edge
    facts:
      lsp: >-
        kotlin-lsp, declared by this pack and provisioned via the generated
        local plugin
      mise_tool: kotlin
      manifest: >-
        n/a — the Android Gradle files are subordinate to pubspec.yaml and
        configure native dependencies only
  - token: swift
    role: platform-edge
    facts:
      lsp: >-
        sourcekit-lsp, declared by this pack and provisioned via the generated
        local plugin
      mise_tool: >-
        n/a — provided by Xcode, which the Flutter build drives
      manifest: >-
        n/a — the iOS project is subordinate to pubspec.yaml, which even
        toggles the Swift package manager
lsp_servers:
  dart-lsp:
    command: mise
    args: [ x, flutter@latest, --, dart, language-server, --protocol=lsp ]
    extensionToLanguage:
      ".dart": dart
    startupTimeout: 60000
  kotlin-lsp:
    command: mise
    args: [ x, kotlin@latest, --, kotlin-lsp, --stdio ]
    extensionToLanguage:
      ".kt": kotlin
      ".kts": kotlin
    startupTimeout: 60000
  sourcekit-lsp:
    command: mise
    args: [ x, --, sourcekit-lsp ]
    extensionToLanguage:
      ".swift": swift
    startupTimeout: 1000
harness:
  goldens:
    task: test:golden
    mechanism: >-
      Flutter golden tests plus flutter_test's meetsGuideline accessibility
      assertions — the SDK's own visual and a11y gate
