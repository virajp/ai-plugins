name: Claude Design
summary: The canvas Anthropic hosts at claude.ai/design — designed pages live
  on a canvas project, reached over its own MCP server.
version: 0.1.0
type: design-tool
kind: design-tool
axis: design
# The bundle slug IS the projects.<name>.design token, so the pin and the
# config key are one value rather than two that can disagree.
# A design tool satisfies no harness capability: nothing is booted or probed.
harness: n/a
mcp_servers: # written into the project's .mcp.json behind tier-2 consent
  claude-design:
    type: http
    url: https://api.anthropic.com/v1/design/mcp
