# settings.json hook entries this pack's scripts need. Landing these is the
# materializer's separate settings-consent line — declining leaves
# npm-normalize.sh in .claude/hooks/ and inert, which is safe: the hook only
# rewrites a command that was going to run the wrong package manager anyway.
hooks:
  PreToolUse:
    - matcher: Bash
      hooks:
        - type: command
          command: "${CLAUDE_PROJECT_DIR}/.claude/hooks/npm-normalize.sh"
          timeout: 5
          async: false
