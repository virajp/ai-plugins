name: Bash
summary: Shell as a project's incidental second language — the hook scripts
  and
  small executables a markdown-authored project ships, held to portability and
  exit-code discipline rather than to a toolchain.
version: 0.1.0
type: language
kind: language-bundle
axis: project
platforms: [ plugin ]
languages:
  - token: bash
    facts:
      lsp: >-
        n/a — no language server is provisioned for shell here. One exists in
        the ecosystem, but nothing this pack lands depends on it and pinning it
        would install a tool the project never asked for
      mise_tool: >-
        n/a — the shell is the operating system's. A project shipping hook
        scripts runs them under whatever shell the host invokes, which is
        exactly why the portability rule below is the whole discipline
      manifest: >-
        n/a — shell scripts declare no dependencies, so there is no manifest for
        doctor to check a dependency list against
harness: n/a
