name: TypeScript
summary: The Node/TypeScript language baseline — standards, error semantics,
  the async model, testing, build and run, config and observability wiring.
version: 0.1.0
type: language
kind: language-bundle
axis: project
platforms: [ service, cli, webapp, site ]
languages:
  - token: typescript
    facts:
      lsp: >-
        typescript-language-server, run through mise; declared by this pack as
        `typescript-lsp` and provisioned via the generated local plugin
      mise_tool: node
      manifest: package.json
  - token: javascript
    facts:
      lsp: >-
        typescript-language-server, run through mise; the same `typescript-lsp`
        server serves both tokens
      mise_tool: node
      manifest: package.json
lsp_servers:
  typescript-lsp:
    command: mise
    args:
      - x
      - --
      - pnpm
      - --package=typescript
      - --package=typescript-language-server
      - dlx
      - typescript-language-server
      - --stdio
    extensionToLanguage:
      ".ts": typescript
      ".cts": typescript
      ".mts": typescript
      ".js": javascript
      ".cjs": javascript
      ".mjs": javascript
      ".tsx": typescriptreact
      ".jsx": javascriptreact
    startupTimeout: 60000
harness: n/a
