# pnpm workspace. The root package is the published installer CLI; `installer`
# is the private package it bundles, and `scripts` is the repo tooling that validates
# the authored `plugins/` tree and generates the marketplace manifest from it.
# `schema` and `renderer` retired with the template layer — plugins are authored
# directly under `plugins/` in Claude's native format, so nothing renders and no
# neutral manifest needs a zod schema.
#
# `scripts` is private and never published: it runs from a checkout, straight
# from source, so it needs no build step and appears in no tarball.
#
# `site` is the website, built by Astro, versioned and tagged on its own
# (`site-v*`) and never published to npm — the root `files` list is `bin` alone.
packages:
  - installer
  - scripts
  - site

# Install scripts are blocked by default. esbuild is the one exception: it is
# tsup's engine — which builds `installer/` into the published `bin/` — and its
# postinstall links the platform-specific binary, so the build cannot run at
# all without it.
#
# `allowBuilds`, not the older `onlyBuiltDependencies`: pnpm replaced that key
# in v10.26 and this repo is on 11.x, where the old spelling parses fine and
# silently does nothing.
allowBuilds:
  esbuild: true

# Supply-chain hardening: refuse to install a dependency version until it has been
# public for at least this many MINUTES. A compromised release is usually caught
# and unpublished within a few days, so this cooldown keeps fresh, malicious
# versions out of installs and out of the monthly `pnpm update`.
# https://pnpm.io/settings#minimumreleaseage
minimumReleaseAge: 600 # 10 hours

# Versions that must bypass the cooldown (e.g. a critical security hotfix):
# minimumReleaseAgeExclude:
#   - some-package@1.2.3

# Transitive-dependency fixes for known vulnerabilities upstream has not picked
# up yet (release.yml gates on osv-scanner, so an unpatched advisory blocks
# publishing). Drop an entry once the dependency ships the fix itself.
overrides:
  # brace-expansion GHSA-mh99-v99m-4gvg (unbounded expansion → OOM) +
  # GHSA-3jxr-9vmj-r5cp (exponential-time expansion). Both are fixed in 5.0.8;
  # the 2.x line has a patch for the latter only, so it cannot be pinned clean.
  # Path: @oclif/core → minimatch@10 → brace-expansion.
  "brace-expansion@5": "5.0.8"

  # The second path to brace-expansion is @oclif/core → ejs → jake → filelist →
  # minimatch@5, which pins ^2.0.1. It can't be bumped to the patched 5.x:
  # minimatch@5 does `expand = require('brace-expansion')` and calls it, while
  # 5.x exports a namespace ({expand, …}) — the override breaks it outright.
  # Instead drop the subtree: `jake` is required only by ejs's CLI entrypoint
  # (bin/cli.js), never by the library (lib/ejs.js) that oclif loads.
  "ejs>jake": "-"

  # esbuild GHSA-g7r4-m6w7-qqqr (dev server responds to any origin, so a page
  # the developer visits can read what it serves). Low severity, and it reaches
  # us only through devDependencies — but osv-scanner reads the lockfile and
  # gates release.yml, so it blocked the v3.0.0 publish outright.
  # Two paths, neither of which has shipped the fix: tsup 8.5.1 (via itself and
  # bundle-require) and vitest 4.1.10 (via vite 8.2.1).
  # Pinned to 0.28.1 — the first fixed version, and two months public — rather
  # than the 0.28.2 released yesterday, which the `minimumReleaseAge` cooldown
  # above exists to keep out of an install this close to its publish date.
  "esbuild": "0.28.1"
