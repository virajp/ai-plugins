# mempalace mining config for this repo.
#
# Per plugins/vwf/assets/memory.md: one product, one wing, one config file at
# the repo root. `mempalace mine` looks for mempalace.yaml in the directory it is
# pointed at and nowhere else — no parent search, no `.config/` convention, no
# --config flag. A copy anywhere else is silently inert: the mine still runs,
# reports auto-detected defaults, and files everything into `general`.
#
# Routing walks a file's path parts outermost-first and returns on the first room
# whose name or keywords match, so every top-level directory is claimed below on
# purpose. `docs` itself stays unclaimed so that docs/memory/<room>/ reaches its
# own room, docs/installer/ reaches `installer`, and docs/plugins/ reaches `plugins`.
#
# But leaving `docs` unclaimed is only half a rule, and the other half had to be
# learned from a mine: an unclaimed part means routing walks *past* it, so any
# docs/ subtree whose own name — or, worse, whose filename — brushes a room's
# keyword is captured by it. Two did: `docs/plans/**` landed in `planning` on the
# `plans` keyword, and `docs/how-to/operate/sessions-and-handoff.md` landed in
# the then-existing `handoff` room on its *filename*, where a guide about the
# mechanism outranked the state it described. Nothing errored; the room just
# stopped meaning one thing.
#
# So every docs/ subtree is now claimed as deliberately as every top-level
# directory, and the keyword that did the first capture is gone: `planning` keeps
# only its own name. A room should be reachable by its own name — which is how
# docs/memory/<room>/ still finds it — and by little else.

wing: ai-plugins

exclude_patterns:
  # Secrets — the backstop behind .gitignore, which mining already honours by
  # default. This layer catches the one case .gitignore cannot: a credential
  # that was committed anyway, and is therefore not ignored.
  - .env*
  - "*.pem"
  - "*.key"
  - "*.p12"
  - "*credentials*"
  - "*secret*"

  # The generated marketplace manifest. `plugins/` itself is authored and is
  # mined — there is one tree now, so nothing is a near-duplicate of anything.
  - /.claude-plugin/

  # Dependency and build output. node_modules/, dist/ and bin/ are already
  # gitignored (and node_modules/ and dist/ are in mempalace's own SKIP_DIRS);
  # listed for the case where the tree is mined without git.
  - node_modules/
  - dist/
  - /bin/

rooms:
  # ---------------------------------------------------------------------------
  # The docs/memory/ rooms. This repo ships vwf but no longer runs it on itself,
  # so only the four committed rooms are seeded — `runs`, `doctor` and `handoff`
  # were dropped with the directories that fed them. Seeding matters because an
  # implicit room, created by the first agent write, carries no keywords: a later
  # mine routes nothing to it and it only holds what was filed by hand.
  # ---------------------------------------------------------------------------
  - name: decisions
    description: Design and architecture decisions with their rationale, from
      docs/memory/decisions/
    keywords: [ decisions, rationale ]
  - name: problems
    description: Review and security findings and how they were resolved, from
      docs/memory/problems/
    keywords: [ problems, findings ]
  - name: planning
    description: Plan rationale and deferred options, from docs/memory/planning/
    # `plans` removed: it captured all of docs/plans/, which is cycle-plan
    # documents rather than the rationale vwf files here. They go to `repo-plans`.
    keywords: [ planning ]
  - name: gaps
    description: Blueprint and plan holes surfaced during execution, plus scope
      parked during elicitation
    keywords: [ gaps ]

  # ---------------------------------------------------------------------------
  # Path-derived rooms — what this repo actually holds.
  # ---------------------------------------------------------------------------
  - name: plugins
    description: Authored plugin sources under plugins/ and their user docs
      under docs/plugins/
    keywords: [ plugins, plugin ]
  - name: installer
    description: The install-time half — the @askviraj/ai-plugins CLI in
      installer/
      and docs/installer/
    keywords: [ cli, installer ]
  - name: configuration
    description: Repo machinery under .config/ — mise envs, linter, formatter,
      and pre-commit config
    keywords: [ config, mise ]
  - name: cicd
    description: GitHub Actions workflows — plugin validation, npm release,
      and the monthly dep update
    keywords: [ github, workflows ]
  - name: repo-doctrine
    description: This repo's own Claude Code skills and agents under .claude/,
      plus CLAUDE.md
    keywords: [ claude ]
  - name: guides
    description: The task-shaped operator guides under docs/how-to/ - the
      greenfield and brownfield walkthroughs, and the operating loops
    # Claims the `how-to` part so routing returns there. Without it these walk
    # past `docs` and past `how-to` and are then routed by whatever their own
    # filename brushes — which put ten of them in `plugins` and one in `handoff`.
    keywords: [ how-to, guides ]
  - name: repo-plans
    description: Cycle-plan documents under docs/plans/, including the archived
      and multi-workstream ones
    # Named `repo-plans` rather than `plans` so it cannot be misread as the
    # protocol room `planning`, which holds vwf's own plan rationale.
    keywords: [ plans ]
  - name: general
    description: Files that don't fit other rooms
    keywords: []
