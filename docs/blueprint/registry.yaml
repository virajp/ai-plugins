# Project Registry — docs/blueprint/registry.yaml
#
# The machine-readable description of the system. `blueprint`, `plan`,
# `execute`, `verify`, `screens`, and `mockups` parse THIS file; none of them
# reads architecture.md, which is the prose view of the same facts.
#
# Typed by path (no frontmatter), like schema.yaml and the OpenAPI contracts.
#
# What is NOT here:
#   - `stack` — the concrete technology per project lives in `.config/vwf.yaml`
#     under `projects.<name>.stack`.
#   - `members` — topology facts live in `.config/vwf.yaml`.
#   - enforcement opt-outs — vwf operating config, `.config/vwf.yaml`.
#   - prose, rationale, or hosting narrative — architecture.md.

vwf_registry: 2

projects:
  - name: plugins
    role: system
    platforms: [ plugin ]
    path: plugins/
    capabilities: [ runtime-settings ]
    depends_on: []
    doc_unit: module

  - name: installer
    role: system
    platforms: [ cli ]
    path: cli/
    capabilities: []
    threat_notes:
      - >-
        Supply chain: one command registers a marketplace and installs from it,
        so a compromised source repo or a hijacked package name runs as the
        developer on their own machine, with their credentials and their
        agent's tool access, before anything is reviewed.
    depends_on: []
    doc_unit: module

cross_cutting:
  auth: none
  errors: exit-code-and-message
  observability: no-telemetry-by-design
  config: env-vars
  testing: unit-integration-and-real-install
  integrations: [ github, npm-registry, context7 ]
  runtime_settings: config-file-per-repo
  # Core foundations (product-foundations). All five are ADAPTED rather than
  # accepted or deferred: the defaults assume a deployed, multi-user service,
  # and this product is a toolkit that runs on one developer's own machine.
  users: single-local-actor
  reliability: delivery-surface-availability
  dr: release-artifact-recoverability
  incidents: release-failure-conditions
