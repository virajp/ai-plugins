name: typescript
version: 3.0.0
description: "The TypeScript language plugin — one plugin per language, covering
  both `typescript` and `javascript`. A `typescript` router skill (lean SKILL.md
  routing to on-demand references: the coding standards baseline, Vitest testing,
  the build pipeline for single-package and monorepo) plus an `effect` router
  skill for Effect-TS doctrine, `package-json`, `pnpm`, `tsconfig`,
  `lint-format`, and the TypeScript/JavaScript language server. Owns every
  TypeScript stack template — 7 project roles, the npm-package deploy target and
  the pnpm/bun repo choices — and implements the vwf stack-adapter contract."
category: development
languages:
  - typescript
  - javascript
tags:
  - typescript
  - javascript
  - effect
  - effect-ts
  - pnpm
  - tsconfig
  - monorepo
  - build
  - vitest
  - testing
  - skills
  - language-server
  - lsp
  - vwf-stack-adapter
author:
  name: Viraj Patel
strict: true
source:
  kind: local
requires:
  - mise
  - pnpm
lspServers:
  typescript-lsp:
    command: mise
    args:
      - x
      - --
      - pnpm
      - --package=typescript
      - --package=typescript-language-server
      - dlx
      - typescript-language-server
      - --stdio
    extensions:
      .cjs: javascript
      .cts: typescript
      .js: javascript
      .jsx: javascriptreact
      .mjs: javascript
      .mts: typescript
      .ts: typescript
      .tsx: typescriptreact
    startupTimeout: 60000
    idAliases:
      opencode: typescript
