name: orchestration
version: 0.1.1
description: "Async orchestration capability plugin for vwf — the neutral
  contract every durable-work backend must satisfy (at-least-once delivery and
  the idempotency it forces, retry and back-off discipline, the poison-message
  path, visibility into work in flight) plus the self-hosted engine that belongs
  to no cloud: **Temporal**. Managed flavours — Cloud Workflows, Pub/Sub, task
  queues and the rest — come from the project's own cloud plugin, not from here.
  Implements the vwf stack-adapter contract."
category: development
tags:
  - orchestration
  - workflows
  - queue
  - temporal
  - capability
  - vwf-stack-adapter
