name: context7
version: 1.1.0
description: Context7 MCP docs server — fetches current, version-accurate
  documentation for libraries, frameworks, SDKs, and CLIs on demand, so code is
  never written from stale training knowledge.
category: development
tags:
  - context7
  - mcp
  - docs
  - documentation
  - libraries
author:
  name: Viraj Patel
strict: true
source:
  kind: local
requires:
  - pnpm
mcpServers:
  context7:
    transport: stdio
    command: pnpm
    args:
      - dlx
      - "@upstash/context7-mcp"
    env:
      CONTEXT7_API_KEY: ${CONTEXT7_API_KEY:-}
