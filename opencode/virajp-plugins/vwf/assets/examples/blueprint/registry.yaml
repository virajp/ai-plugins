# Conformance example (blueprint-format 22) — the machine-readable registry.
#
# Every downstream command parses THIS file; architecture.md is the prose view
# and is omitted from this bundle for brevity. Note what is absent: there is no
# `stack` key anywhere. The concrete technology lives in `.config/vwf.yaml`
# under `projects.<name>.stack`, which no blueprint-authoring or reviewing
# surface reads — which is why no doc in this bundle names a database, cloud,
# framework, or vendor, and why doing so would be a reviewer failure rather
# than a matter of taste.

vwf_registry: 2

# Each project carries exactly ONE `role` — the coarse domain grouping — plus
# one or more `platforms` from that role's closed list. Format 22 replaced the
# seven-token role vocabulary with four roles; every retired role token
# (`service`, `worker`, `packages`, `site`, `fullstack`, `frontend`, `iac`)
# lives on as a platform.
#
# `web` here declares `webapp` — the browser-delivered application, calling the
# api project. A project publishing its own API alongside its own UI declares
# `[service, webapp]`, which is what `fullstack` used to mean and what an
# operator back-office is (that plus the `operator-rbac` capability).
#
# The platforms are what everything downstream keys on: `webapp` is a SCREEN
# platform, so `web` gets the design-system mandate, the standard flows, and one
# <platform>.md per flow. `service` and `worker` are screenless, so api and
# worker flows are index.md alone — and `service` is what requires
# apis/api.openapi.yaml and a health endpoint.

projects:
  - name: web
    role: frontend
    platforms: [ webapp ]
    path: apps/web
    capabilities: [ ssr, seo ]
    depends_on: [ api ]
    doc_unit: page

  - name: api
    role: backend
    platforms: [ service ]
    path: services/api
    capabilities: [ relational-datastore, payments-subscriptions, audit-log ]
    depends_on: []
    doc_unit: entity

  - name: worker
    role: backend
    platforms: [ worker ]
    path: services/worker
    capabilities: [ scheduled-jobs, message-queue, email ]
    depends_on: [ api ]
    doc_unit: entity

cross_cutting:
  auth: session-cookie
  errors: coded-envelope
  observability: opentelemetry
  config: env-vars
  testing: unit-integration
  integrations: [ payment-provider, email-provider ]
  audit: privileged-destructive
