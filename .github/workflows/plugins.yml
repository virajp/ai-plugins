name: Plugins

# Validates the plugin toolkit: the authored templates/ tree, the five rendered
# target trees at the repo root, and the renderer itself.
#
# Deliberately a SEPARATE workflow from release.yml. npm allows exactly one
# Trusted Publisher per package and validates the entry-point workflow's
# filename, so release.yml's trigger surface is left untouched — this file
# publishes nothing and holds no id-token permission.
#
# Until now these checks ran only in pre-commit, which means they ran only for
# whoever had the hooks installed. The render-clean gate in particular has no
# other home: the rendered trees are committed, so a template edited without a
# rebuild is invisible to every other check.
on:
  push:
    branches: [ main ]
  pull_request: {}
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: plugins-${{ github.ref }}
  cancel-in-progress: true

env:
  MISE_ENV: ci

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up mise (node + pnpm, ci env)
        uses: jdx/mise-action@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Order matters: prove the rendered trees are what templates/ renders to
      # BEFORE validating them, so a stale tree fails as staleness rather than
      # as some confusing downstream assertion.
      - name: Rendered trees match a fresh render
        run: mise run plugins:render-clean

      - name: Static validation + coverage report
        run: mise run plugins:check

      - name: Renderer and schema tests
        run: pnpm vitest run

      # The BSD-sed portability guarantee. Runs on GNU sed here, which is the
      # point: the script has to work under both.
      - name: vwf hook tests
        run: mise run vwf:test
