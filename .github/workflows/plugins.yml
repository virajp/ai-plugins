name: Plugins

# Validates the plugin toolkit: the authored templates/ tree, the five rendered
# targets under dist/, and the renderer itself.
#
# Deliberately a SEPARATE workflow from release.yml. npm allows exactly one
# Trusted Publisher per package and validates the entry-point workflow's
# filename, so release.yml's trigger surface is left untouched — this file
# publishes nothing and holds no id-token permission.
#
# Until now these checks ran only in pre-commit, which means they ran only for
# whoever had the hooks installed. The dist-clean gate in particular has no
# other home: dist/ is committed, so a template edited without a rebuild is
# invisible to every other check.
on:
  push:
    branches: [ main ]
  pull_request: {}
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: plugins-${{ github.ref }}
  cancel-in-progress: true

env:
  MISE_ENV: ci

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up mise (node + pnpm, ci env)
        uses: jdx/mise-action@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Order matters: prove dist/ is what templates/ renders to BEFORE
      # validating it, so a stale tree fails as staleness rather than as some
      # confusing downstream assertion.
      - name: dist/ matches a fresh render
        run: mise run plugins:dist-clean

      - name: Static validation + coverage report
        run: mise run plugins:check

      - name: Renderer and schema tests
        run: pnpm vitest run

      # The BSD-sed portability guarantee. Runs on GNU sed here, which is the
      # point: the script has to work under both.
      - name: vwf hook tests
        run: mise run vwf:test
