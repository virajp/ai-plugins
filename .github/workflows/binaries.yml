name: Binaries

# Builds the standalone per-platform archives and attaches them to a GitHub
# Release.
#
# Deliberately a SEPARATE workflow from release.yml, for two reasons:
#
#   1. npm allows exactly ONE Trusted Publisher per package and validates the
#      ENTRY-POINT workflow's filename. release.yml's `on:` block is therefore
#      untouchable — adding a trigger there risks ENEEDAUTH, which this repo has
#      already lost two months to once.
#   2. It removes a race. release.yml fires on the tag push, but the Release
#      itself is created by hand afterwards (`gh release create --verify-tag`),
#      so a job in release.yml would have nothing to upload to. Triggering on
#      `release: published` means the Release provably exists.
#
# This workflow publishes nothing to npm and holds no id-token permission.
on:
  release:
    types: [ published ]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to build and attach binaries to"
        required: true

permissions:
  contents: read

env:
  MISE_ENV: ci

jobs:
  binaries:
    runs-on: ubuntu-latest
    # Only this job writes, and only to release assets. Scoped here rather than
    # at the workflow level so the default stays read-only.
    permissions:
      contents: write
    steps:
      - name: Resolve the tag
        id: tag
        run: |
          tag="${{ github.event.inputs.tag || github.event.release.tag_name }}"
          if [ -z "$tag" ]; then
            echo "::error::no tag to build for"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.tag.outputs.tag }}

      - name: Set up mise (node + pnpm + bun, ci env)
        uses: jdx/mise-action@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The archives carry the rendered trees verbatim, so a stale or
      # hand-edited tree would ship to every binary user. Same gate plugins.yml
      # runs, for the same reason.
      - name: Assert the rendered trees match a fresh render
        run: mise run plugins:render-clean

      # bun cross-compiles every target from one host, so this needs no runner
      # matrix — five platforms, one job.
      - name: Build the per-platform archives
        run: mise run i:binaries

      - name: Attach them to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ steps.tag.outputs.tag }}"
          # --clobber so a re-run replaces assets rather than failing on them.
          gh release upload "$tag" release/*.tar.gz release/*.zip \
            release/checksums-*.txt --clobber
