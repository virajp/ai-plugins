name: Release

# Publishes @askviraj/ai-plugins to npm. Triggered two ways:
#   1. a pushed version tag (v*)   — the normal manual release path
#   2. workflow_dispatch           — manual re-publish, and how deps-update.yml
#                                    publishes its monthly release (`--ref <tag>`)
# Auth is OIDC "trusted publishing" (no stored token) — npm verifies this repo +
# workflow's GitHub identity and adds provenance automatically. npm allows only
# ONE Trusted Publisher per package, and it validates the ENTRY-POINT workflow's
# filename — so every publish path must enter through THIS file. `workflow_call`
# is therefore unusable: when deps-update.yml called this workflow, npm saw
# `deps-update.yml`, matched nothing, and failed with ENEEDAUTH. One-time setup:
# on npmjs.com add this repo + `release.yml` as the package's Trusted Publisher.
# To release manually: bump the version, then push a matching tag (e.g. v1.2.0).
on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

# id-token: write is required for OIDC trusted publishing.
permissions:
  contents: read
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  MISE_ENV: ci

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      # The triggering ref: the pushed tag, or whatever ref the dispatch named
      # (deps-update.yml dispatches this workflow on the tag it just pushed).
      # fetch-depth: 0 because the branch check below needs enough history to
      # answer whether the tagged commit is reachable from main. A shallow
      # checkout makes `merge-base --is-ancestor` fail for lack of commits
      # rather than for the reason the gate exists.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Set up mise (node + pnpm, ci env)
        uses: jdx/mise-action@v4

      # Runs whenever the ref is a tag — a tag push, or a dispatch on a tag.
      # A dispatch on a branch skips it.
      - name: Verify the tag matches package.json version
        if: github.ref_type == 'tag'
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::tag v$tag does not match package.json version $pkg"
            exit 1
          fi
          echo "Releasing @askviraj/ai-plugins@$pkg"

      # conventions.md#pipeline, rule `pipeline/branch-validated`: a release tag
      # must be reachable from the default branch. Without this, a tag pushed
      # from any branch publishes — the tag/package.json check above proves the
      # version is consistent, never that the commit was ever reviewed.
      # Skipped for a dispatch on a branch, like the version check.
      - name: Verify the tag is reachable from main
        if: github.ref_type == 'tag'
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::tag $GITHUB_REF_NAME is not reachable from main — refusing to publish"
            exit 1
          fi
          echo "$GITHUB_REF_NAME is on main."

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Security gate: osv-scanner exits non-zero if the locked dependencies
      # include any known-vulnerable package, blocking the publish. If a fix
      # isn't yet available, add an osv-scanner.toml ignore or a pnpm override.
      - name: Security-scan the dependencies (osv-scanner)
        run: osv-scanner scan source --lockfile=pnpm-lock.yaml

      - name: Run tests
        run: mise run i:test

      - name: Verify the publishable package
        run: mise run i:build

      # OIDC trusted publishing needs npm >= 11.5.1; the node-bundled npm may lag.
      - name: Ensure npm supports OIDC trusted publishing
        run: npm install -g npm@latest

      # Idempotent: skip (don't fail) if this version is already on npm, so tag
      # re-points, dispatch retries, and re-runs are safe no-ops.
      - name: Publish to npm (OIDC trusted publishing + provenance)
        run: |
          ver="$(node -p "require('./package.json').version")"
          if npm view "@askviraj/ai-plugins@$ver" version >/dev/null 2>&1; then
            echo "@askviraj/ai-plugins@$ver is already published — skipping."
            exit 0
          fi
          npm publish --access public
