name: Monthly dependency update & release

# Once a month: refresh pnpm dependencies (bounded by the minimumReleaseAge
# cooldown in pnpm-workspace.yaml), security-scan them, cut a patch release, and
# publish to npm. The refreshed lockfile and version bump are committed to
# `develop` and merged to `main`, which is then tagged. If nothing changed, it
# does nothing.
#
# Publishing is delegated to release.yml by DISPATCHING it (not an inline
# `npm publish`, and not `workflow_call`): npm allows only ONE Trusted Publisher
# per package and validates the ENTRY-POINT workflow's filename, so a
# `workflow_call` from here made npm see `deps-update.yml` and fail with
# ENEEDAUTH. A dispatch makes release.yml the entry point, matching the Trusted
# Publisher. The tag push alone cannot do it — GITHUB_TOKEN-pushed refs don't
# trigger workflow runs — but workflow_dispatch is an explicit exception to that
# rule, so no PAT or GitHub App token is needed.
# https://docs.github.com/en/actions/concepts/security/github_token
on:
  schedule:
    - cron: "0 2 1 * *" # 02:00 UTC on the 1st of each month
  workflow_dispatch: {}

permissions:
  contents: write # commit + push the refresh, version bump, and tag
  actions: write # dispatch release.yml on the new tag

concurrency:
  group: deps-update
  cancel-in-progress: false

env:
  MISE_ENV: ci

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      # `develop`, not the default branch: main is merge-only, so this workflow
      # takes the same route a human does — land on develop, merge to main.
      # fetch-depth: 0 because that merge needs main's history; a shallow clone
      # cannot fast-forward it.
      - uses: actions/checkout@v7
        with:
          ref: develop
          fetch-depth: 0

      - name: Set up mise (node + pnpm, ci env)
        uses: jdx/mise-action@v4

      - name: Update dependencies (respects the minimumReleaseAge cooldown)
        run: pnpm update

      - name: Check whether anything changed
        id: changed
        run: |
          if git diff --quiet -- pnpm-lock.yaml package.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No dependency changes this month — nothing to release."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # Security gate: osv-scanner exits non-zero if the refreshed lockfile pulls
      # in any known-vulnerable package, failing the run BEFORE anything is pushed.
      # If a fix isn't yet available, add an osv-scanner.toml ignore or a pnpm
      # override.
      - name: Security-scan the updated dependencies (osv-scanner)
        if: steps.changed.outputs.changed == 'true'
        run: osv-scanner scan source --lockfile=pnpm-lock.yaml

      # The refresh and the bump are ordinary develop commits; main receives them
      # by merge. `i:release` no longer bumps or commits — it tags what main
      # already carries — so the bump is `i:version` here, exactly as a human
      # would run it.
      - name: Cut a patch release (commit on develop, merge to main, tag)
        id: release
        if: steps.changed.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add pnpm-lock.yaml package.json
          mise x -- git commit -m "ops(deps): monthly dependency refresh"

          mise run i:version
          version="$(node -p "require('./package.json').version")"
          git add package.json
          mise x -- git commit -m "ops: bump installer to ${version}"
          git push origin develop

          # Merge rather than force main to develop: if main ever carries a
          # commit develop does not, a fast-forward push would fail here while a
          # merge resolves it. A conflict fails the run, which is correct.
          git fetch origin main
          git checkout -B main origin/main
          git merge --no-edit develop
          git push origin main

          # Tag only — i:release verifies the branch, runs i:test and stops
          # before pushing, because this job owns the push and the dispatch.
          mise run i:release --ci
          # Must match the tag i:release just created, and release.yml's
          # `installer-v*` filter. Plugin releases use `<name>-v<version>` and
          # never come through here.
          tag="installer-v${version}"
          git push origin "$tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      # Hand the npm publish to release.yml so IT is the entry point npm's
      # Trusted Publisher check sees. Fire-and-forget: release.yml's own run is
      # the record of whether the publish succeeded.
      - name: Publish the tag via release.yml
        if: steps.changed.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.release.outputs.tag }}
        run: gh workflow run release.yml --ref "$TAG"
