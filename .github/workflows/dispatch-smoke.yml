name: Dispatch smoke test

# TEMPORARY — delete after use.
#
# Verifies the one link deps-update.yml's publish path depends on: that
# `gh workflow run` executed INSIDE Actions with the built-in GITHUB_TOKEN
# actually triggers release.yml. Refs pushed with GITHUB_TOKEN don't start
# workflow runs, but workflow_dispatch is documented as an exception; this
# proves it for real rather than on faith.
#
# It dispatches release.yml on an ALREADY-PUBLISHED tag, so release.yml's
# idempotent publish step short-circuits ("already published — skipping") and
# nothing reaches npm.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Already-published tag to dispatch release.yml on"
        required: true
        default: "v2.7.3"
        type: string

permissions:
  actions: write # dispatch release.yml

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch release.yml with GITHUB_TOKEN
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow run release.yml --ref "$TAG"
