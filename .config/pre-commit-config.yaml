default_install_hook_types:
  - pre-commit
  - commit-msg

repos:
  - repo: local
    hooks:
      - id: git-config
        name: Forbidden Local git-config
        description: Prevents local .git/config from overriding global user and
          signing settings.
        entry: mise x -- mise run code:git-config --fix
        language: system
        pass_filenames: false
        always_run: true
        stages: [ pre-commit ]

  - repo: local
    hooks:
      - id: typescript-hook-test
        name: typescript npm→pnpm hook tests
        entry: mise x -- mise run typescript:test
        language: system
        pass_filenames: false
        files: ^templates/typescript/hooks/
        stages: [ pre-commit ]
      # The rendered trees are generated, so they are rebuilt before they are
      # validated: a template edit that was never re-rendered would otherwise
      # pass the checker against a stale tree. The render is deterministic and
      # destructive per target, so running it here is safe and makes
      # `render-clean` below meaningful.
      - id: plugins-build
        name: render every target
        entry: mise x -- mise run plugins:build
        language: system
        pass_filenames: false
        files: ^(templates/|build/|schema/)
        stages: [ pre-commit ]
      - id: plugins-check
        name: plugin tree static validation
        entry: mise x -- mise run plugins:check
        language: system
        pass_filenames: false
        files: ^(templates/|build/|schema/|claude/|cursor/|ohmypi/|opencode/)
        stages: [ pre-commit ]
      # The committed render must be exactly what templates/ renders to. Catches
      # the case the two hooks above cannot: output edited by hand, or a render
      # whose result was never staged.
      - id: render-clean
        name: rendered trees match a fresh render
        entry: mise x -- mise run plugins:render-clean
        language: system
        pass_filenames: false
        files: ^(templates/|build/|schema/|claude/|cursor/|ohmypi/|opencode/)
        stages: [ pre-commit ]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-shebang-scripts-are-executable
        name: Check that scripts with shebangs are executable
        stages: [ pre-commit ]
      - id: check-executables-have-shebangs
        name: Check that executables have shebangs
        stages: [ pre-commit ]
      - id: check-merge-conflict
        name: Check for merge conflicts
        stages: [ pre-commit ]
      - id: end-of-file-fixer
        name: Ensure files end with a newline
        stages: [ pre-commit ]
      - id: trailing-whitespace
        name: Remove trailing whitespace
        stages: [ pre-commit ]
      - id: check-added-large-files
        name: Check for added large files (>1MB)
        args: [ "--maxkb=1024" ]
        stages: [ pre-commit ]
      - id: check-symlinks
        name: Check for broken symlinks
        stages: [ pre-commit ]
      - id: destroyed-symlinks
        name: Check for destroyed symlinks
        stages: [ pre-commit ]

  - repo: local
    hooks:
      - id: formatter
        name: Formatter
        entry: mise x -- dprint fmt --allow-no-files --log-level warn
        exclude: (^|.*/)package\.json$
        language: system
        stages: [ pre-commit ]

  - repo: local
    hooks:
      - id: linter
        name: Linter
        entry: mise x -- pnpm dlx @askviraj/linter --fix
        # The root trees are rendered output. pre-commit passes staged paths
        # explicitly, and the linter warns on each one it is configured to
        # ignore — enough warnings to fail the run. Keep them out of the
        # argument list entirely.
        exclude: ^(claude|cursor|ohmypi|opencode)/
        language: system
        stages: [ pre-commit ]

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.0
    hooks:
      - id: gitleaks
        name: Check for secrets
        args: [ --config, .config/gitleaks.toml ]
        stages: [ pre-commit ]

  - repo: https://github.com/qoomon/git-conventional-commits
    rev: v2.9.0
    hooks:
      - id: conventional-commits
        name: Conventional Commits
        args: [ "--config", ".config/git-conventional-commits.yaml" ]
        stages: [ commit-msg ]
