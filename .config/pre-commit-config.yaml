default_install_hook_types:
  - pre-commit
  - commit-msg

repos:
  - repo: local
    hooks:
      - id: git-config
        name: Forbidden Local git-config
        description: Prevents local .git/config from overriding global user and
          signing settings.
        entry: mise x -- mise run code:git-config --fix
        language: system
        pass_filenames: false
        always_run: true
        stages: [ pre-commit ]

  - repo: local
    hooks:
      - id: npm-normalize-hook-test
        name: npm→pnpm/bun hook tests
        entry: mise x -- mise run plugins:npm-normalize-test
        language: system
        pass_filenames: false
        files: ^plugins/stackgen/stacks/package-manager/pnpm/hooks/
        stages: [ pre-commit ]
      # `plugins-build` and `render-clean` retired with the template layer: there
      # is one authored tree under `plugins/` and nothing renders, so there is no
      # staleness for them to catch — except in the one file that is still
      # generated. `.claude-plugin/marketplace.json` is a projection of the 2
      # plugin manifests AND committed, so nothing else notices when the two
      # diverge; this is what render-clean narrowed down to. It fires on a
      # manifest edit and on a hand-edit of the manifest itself, since either
      # side moving is the drift.
      - id: plugins-marketplace
        name: Marketplace manifest matches the plugin manifests
        entry: mise x -- mise run plugins:marketplace --check
        language: system
        pass_filenames: false
        files: ^(plugins/|\.claude-plugin/)
        stages: [ pre-commit ]
      # The second generated-and-committed file: the stackgen pack, bundle and
      # kind inventory, rendered from the stacks tree so no count is ever typed
      # by hand. Fires on any stacks or kinds edit, and on a hand-edit of the
      # inventory itself.
      - id: plugins-inventory
        name: stackgen inventory matches the stacks tree
        entry: mise x -- mise run plugins:inventory --check
        language: system
        pass_filenames: false
        files: ^plugins/stackgen/(stacks/|assets/kinds\.md)
        stages: [ pre-commit ]
      - id: plugins-check
        name: Static validation of the authored plugins/ tree
        entry: mise x -- mise run plugins:check
        language: system
        pass_filenames: false
        files: ^plugins/
        stages: [ pre-commit ]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      # `main` is merge-only: work lands on `develop` and reaches `main` by a
      # merge, which is what makes a release a deliberate act rather than a
      # push. This is the local half of that; the GitHub `protected-branches`
      # ruleset is the remote half, and blocks only force-push and deletion.
      #
      # It does NOT block merges. Git runs `pre-merge-commit` for a merge that
      # commits on its own, and only `pre-commit` (this stage) for an ordinary
      # commit — so `git merge develop` on `main` passes. A merge that stops on
      # a CONFLICT is the exception: resolving it ends in a real `git commit`,
      # which this blocks. Finish that merge from `develop` instead.
      - id: no-commit-to-branch
        name: No direct commits to main
        args: [ "--branch", "main" ]
        stages: [ pre-commit ]
      - id: check-shebang-scripts-are-executable
        name: Check that scripts with shebangs are executable
        stages: [ pre-commit ]
      - id: check-executables-have-shebangs
        name: Check that executables have shebangs
        stages: [ pre-commit ]
      - id: check-merge-conflict
        name: Check for merge conflicts
        stages: [ pre-commit ]
      - id: end-of-file-fixer
        name: Ensure files end with a newline
        stages: [ pre-commit ]
      - id: trailing-whitespace
        name: Remove trailing whitespace
        stages: [ pre-commit ]
      - id: check-added-large-files
        name: Check for added large files (>1MB)
        args: [ "--maxkb=1024" ]
        stages: [ pre-commit ]
      - id: check-symlinks
        name: Check for broken symlinks
        stages: [ pre-commit ]
      - id: destroyed-symlinks
        name: Check for destroyed symlinks
        stages: [ pre-commit ]

  - repo: local
    hooks:
      - id: formatter
        name: Formatter
        entry: mise x -- dprint fmt --allow-no-files --log-level warn
        exclude: (^|.*/)package\.json$
        language: system
        stages: [ pre-commit ]

  - repo: local
    hooks:
      - id: linter
        name: Linter
        entry: mise x -- pnpm dlx @askviraj/linter --fix
        # pre-commit passes staged paths explicitly, and the linter warns on every
        # path it has no configuration for — enough warnings to fail the run. So
        # anything it cannot lint must be kept out of the argument list, not merely
        # ignored in .config/linter.yaml.
        #
        # Two kinds: the vwf blueprint templates and example bundle (ignored in
        # linter.yaml, because OKF frontmatter reads as a second H1), and the hook
        # scripts, which are shell — `plugins:npm-normalize-test` is what actually
        # tests those, through the system sed. site/public/brand/ is the logo —
        # SVG, PNG and the social-preview render source — none of which it
        # lints, and its HTML rewrite fights dprint's. (docs/assets/ is where
        # that tree lived until the website move; the pattern goes once it has.)
        exclude: ^plugins/vwf/assets/(templates|examples)/|^(docs/assets|site/public/brand)/|\.sh$
        language: system
        stages: [ pre-commit ]

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.0
    hooks:
      - id: gitleaks
        name: Check for secrets
        args: [ --config, .config/gitleaks.toml ]
        stages: [ pre-commit ]

  - repo: https://github.com/qoomon/git-conventional-commits
    rev: v2.9.0
    hooks:
      - id: conventional-commits
        name: Conventional Commits
        args: [ "--config", ".config/git-conventional-commits.yaml" ]
        stages: [ commit-msg ]
