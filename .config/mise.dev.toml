# Development-only environment — loaded when MISE_ENV=dev (set on the
# maintainer's machine). These tools are NOT installed in CI (which uses
# MISE_ENV=ci); the common node + pnpm runtime lives in mise.toml.

[settings]
# Only relevant to the python/uv dev tools below.
pipx.uvx            = true
python.compile      = false
python.uv_venv_auto = "create|source"

[tools]
# Development tools
doppler    = { version = "latest" }
pre-commit = { version = "latest" }

# Formatter
dprint = { postinstall = "dprint completions fish | source", version = "latest" }
taplo  = { version = "latest" }

# Security tools
gitleaks = { version = "latest" }
grype    = { version = "latest" }

# Shell gates — `plugins:shellcheck` lints and format-checks every shell file a
# stackgen pack ships: the task library under `config/.config/mise/tasks/` and
# the hook scripts under `hooks/`. And actionlint the workflows. Those files are
# executed in someone else's repo, where nothing else ever reads them, so this
# is the only place a bad one is caught.
actionlint = { version = "latest" }
shellcheck = { version = "latest" }
shfmt      = { version = "latest" }

# AI Tools
jq     = { version = "latest" }
python = { version = "latest" }
uv     = { version = "latest" }

[shell_alias]
be-setup  = "mise run --cd ../backend setup:all"
cc        = "dcc --name 'claude-plugins'"
ccf       = "dccf --name 'claude-plugins'"
cco       = "dcco --name 'claude-plugins'"
fe-setup  = "mise run --cd ../frontend setup:all"
precommit = "mise run code:precommit"
setup     = "mise run setup:all"
