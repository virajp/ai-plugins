# @askviraj/linter configuration
#
# Add custom ignores, rule overrides, and additional config blocks below.

version: 1

ignores:
  - "**/archived/**"
  # Rendered output. Generated from templates/ and committed; linting it would
  # report every finding twice and, worse, invite fixes in the wrong tree.
  - "dist/**"
  # tsup's bundle of cli/. Build output, gitignored, and not ours to style —
  # esbuild emits empty catch blocks and keeps unused helpers from bundled deps.
  # The source it is built from is linted.
  - "bin/**"
  # Gitignored working notes and session handoffs. Never committed, so linting
  # them only ever fails the local gate on prose nobody reviews.
  - "docs/scratchpad/**"
  # vwf blueprint templates + example bundle carry OKF frontmatter (a `title`)
  # alongside a body H1; the linter counts the frontmatter title as an H1, so
  # exclude these template/example docs from markdown linting.
  - "templates/vwf/assets/templates/**"
  - "templates/vwf/assets/examples/**"

overrides:
  markdown:
    rules:
      markdown/no-reversed-media-syntax: off
