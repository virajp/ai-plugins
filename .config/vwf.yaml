config_format: 15
blueprint_format: 23

product:
  name: ai-plugins

topology: monorepo
topology_reason: One pnpm workspace holds the authored plugin tree and the
  installer that publishes from it; they release on separate cadences but share
  every gate, so splitting them would duplicate the toolchain to no end.

ui: false
integrations: true

repo:
  stack:
    template: repo/pnpm-workspace
    package_manager: pnpm
    tools: [ mise, dprint, eslint, pre-commit, gitleaks, grype ]

projects:
  plugins:
    stack:
      template: project/claude-code-plugin
      backing_template: []
      deploy_template: n/a
      languages: [ markdown, bash ]
      frameworks: []
      dependencies: []
      note: A plugin is served from the marketplace on `main`, never deployed,
        so the deploy axis is n/a rather than unset.
    cicd: github-actions
  installer:
    stack:
      template: project/typescript-parseargs-cli
      backing_template: []
      deploy_template: deploy/npm-package
      languages: [ typescript ]
      frameworks: []
      dependencies: [ tsup, vitest ]
      note: node:util parseArgs rather than a CLI framework — the flag surface
        is flat, and the published tarball is four files.
    cicd: github-actions

harness:
  dev: false
  e2e_local: false
  local_stack: false
  e2e_staging: false
  health: false
  screenshots: false

memory:
  wing: ai-plugins

blueprint:
  coverage: partial
  # Sweep PAUSED 2026-08-27, deliberately — not abandoned. The granularity
  # finding that paused it is RESOLVED in vwf 19.2.0: a plugin project's flows
  # are its INVOCABLE extension points, so subagents are steps and auto-applying
  # doctrine is a Reference. Scope fell 48 -> 25 flows (~6M tokens).
  # Two flows REVIEWED. 010-vwf-setup: 4 rounds (6->5->5->1), ~615k tokens, 181
  # lines. 020-vwf-product: 3 rounds (5->3->0), ~429k tokens, 172 lines — the
  # improvement came from front-loading the writer prompt with the eight failure
  # modes 010's reviews found, none of which recurred. Budget ~400k per flow;
  # both sit over the 160-line budget, each certified as genuine overage.
  # /vwf:plan stays blocked while this reads `partial`, which is correct.
  remaining:
    - flows/plugins # 010-vwf-setup + 020-vwf-product REVIEWED; 23 unwritten
    - coherence

enforcement:
  rules:
    pipeline/tag-triggered-deploys:
      waived: true
      reason: No staging destination exists, so the <env> segment would encode a
        distinction this product does not have. Tags keep the <project> segment
        and read <project>-v<semver> (installer-v6.0.0). Paired with the note in
        docs/blueprint/conventions.md#pipeline.
